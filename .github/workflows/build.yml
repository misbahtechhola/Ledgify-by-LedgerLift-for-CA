name: Build Ledgify Installers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build-mac-x64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Build DMG (Intel x64)
        run: npm run build:mac-x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload x64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: Ledgify-macOS-Intel-DMG
          path: dist/*.dmg
          retention-days: 30
  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Build DMG (Apple Silicon arm64)
        run: npm run build:mac-arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload arm64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: Ledgify-macOS-AppleSilicon-DMG
          path: dist/*.dmg
          retention-days: 30
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Build EXE
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Ledgify-Windows-EXE
          path: dist/*.exe
          retention-days: 30
  release:
    needs: [build-mac-x64, build-mac-arm64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Intel DMG
        uses: actions/download-artifact@v4
        with:
          name: Ledgify-macOS-Intel-DMG
          path: ./release
      - name: Download Apple Silicon DMG
        uses: actions/download-artifact@v4
        with:
          name: Ledgify-macOS-AppleSilicon-DMG
          path: ./release
      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: Ledgify-Windows-EXE
          path: ./release
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create v1.0.${{ github.run_number }} ./release/* --repo "${{ github.repository }}" --title "Ledgify v1.0.${{ github.run_number }}" --notes "Free offline accounting for Indian SME traders."
