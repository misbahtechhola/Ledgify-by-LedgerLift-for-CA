name: Build Ledgify Installers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Build DMG
        id: build
        run: npm run build:mac-universal 2>&1 | tee /tmp/build-mac.log; exit ${PIPESTATUS[0]}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder
      - name: Report error if failed
        if: failure() && steps.build.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=$(tail -50 /tmp/build-mac.log 2>/dev/null || echo "No log")
          gh issue create --title "Mac build error (run ${{ github.run_number }})" \
            --body "$(echo "$LOG")" \
            --repo "${{ github.repository }}" || true
      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ledgify-macOS-DMG
          path: dist/*.dmg
          retention-days: 30
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Build EXE
        id: build
        run: npm run build:win 2>&1 | Tee-Object -FilePath C:\build-win.log; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder
      - name: Report error if failed
        if: failure() && steps.build.outcome == 'failure'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $log = Get-Content C:\build-win.log -Tail 50 -ErrorAction SilentlyContinue | Out-String
          gh issue create --title "Win build error (run ${{ github.run_number }})" --body "$log" --repo "${{ github.repository }}"
      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ledgify-Windows-EXE
          path: dist/*.exe
          retention-days: 30
  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Mac
        uses: actions/download-artifact@v4
        with:
          name: Ledgify-macOS-DMG
          path: ./release
      - name: Download Win
        uses: actions/download-artifact@v4
        with:
          name: Ledgify-Windows-EXE
          path: ./release
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create v1.0.${{ github.run_number }} ./release/* --repo "${{ github.repository }}" --title "Ledgify v1.0.${{ github.run_number }}" --notes "Free offline accounting for Indian SME traders."
