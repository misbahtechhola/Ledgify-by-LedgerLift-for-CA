name: Build LedgerLift Suite Installers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build-mac-x64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Build DMG (Intel x64)
        run: |
          npm run build:mac-x64 || true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify and rename x64 DMG
        run: |
          ls -la dist/
          DMG=$(ls dist/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "❌ No DMG found!"
            exit 1
          fi
          echo "✅ Found DMG: $DMG"
          # Ensure filename has -x64 suffix
          NEWNAME=$(echo "$DMG" | sed 's/-x64\.dmg/.dmg/' | sed 's/\.dmg$/-x64.dmg/')
          if [ "$DMG" != "$NEWNAME" ]; then
            mv "$DMG" "$NEWNAME"
            echo "Renamed to: $NEWNAME"
          fi
          ls -lh dist/*.dmg
      - name: Upload x64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: LedgerLift-Suite-macOS-Intel-DMG
          path: dist/*-x64.dmg
          retention-days: 30
  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Detach any stale volumes
        run: |
          hdiutil detach "/Volumes/Install LedgerLift Suite" -force 2>/dev/null || true
          hdiutil detach "/Volumes/Install Ledgify" -force 2>/dev/null || true
      - name: Build DMG (Apple Silicon arm64)
        run: |
          npm run build:mac-arm64 || true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify and rename arm64 DMG
        run: |
          ls -la dist/
          DMG=$(ls dist/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "❌ No DMG found!"
            exit 1
          fi
          echo "✅ Found DMG: $DMG"
          # Ensure filename has -arm64 suffix
          NEWNAME=$(echo "$DMG" | sed 's/-arm64\.dmg/.dmg/' | sed 's/\.dmg$/-arm64.dmg/')
          if [ "$DMG" != "$NEWNAME" ]; then
            mv "$DMG" "$NEWNAME"
            echo "Renamed to: $NEWNAME"
          fi
          ls -lh dist/*.dmg
      - name: Upload arm64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: LedgerLift-Suite-macOS-AppleSilicon-DMG
          path: dist/*-arm64.dmg
          retention-days: 30
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Build EXE
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LedgerLift-Suite-Windows-EXE
          path: dist/*.exe
          retention-days: 30
  release:
    needs: [build-mac-x64, build-mac-arm64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Intel DMG
        uses: actions/download-artifact@v4
        with:
          name: LedgerLift-Suite-macOS-Intel-DMG
          path: ./release
      - name: Download Apple Silicon DMG
        uses: actions/download-artifact@v4
        with:
          name: LedgerLift-Suite-macOS-AppleSilicon-DMG
          path: ./release
      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: LedgerLift-Suite-Windows-EXE
          path: ./release
      - name: List release files
        run: ls -lh ./release/
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.${{ github.run_number }} ./release/* \
            --repo "${{ github.repository }}" \
            --title "LedgerLift Suite v1.0.${{ github.run_number }}" \
            --notes "LedgerLift Suite — Ledgify (SME accounting) + CA Desk (practice management for CAs) in one app.

          Includes:
          - 📦 macOS Intel DMG (*-x64.dmg) — for older Intel Macs
          - 🍎 macOS Apple Silicon DMG (*-arm64.dmg) — for M1/M2/M3 Macs
          - 🪟 Windows Installer (.exe) — NSIS one-click installer

          Switch between Ledgify (SME trader mode) and CA Desk (accountant mode) with one click inside the app."
