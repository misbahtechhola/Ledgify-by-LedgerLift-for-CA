name: Build Ledgify Installers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Build DMG
        run: npm run build:mac-universal
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder
      - name: List dist
        if: always()
        run: ls -la dist/ 2>/dev/null || echo "No dist folder"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Ledgify-macOS-DMG
          path: dist/*.dmg
          retention-days: 30
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Build EXE
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder
      - name: List dist
        if: always()
        shell: cmd
        run: dir dist\ 2>nul || echo No dist folder
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Ledgify-Windows-EXE
          path: dist/*.exe
          retention-days: 30
  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Mac
        uses: actions/download-artifact@v4
        with:
          name: Ledgify-macOS-DMG
          path: ./release
      - name: Download Win
        uses: actions/download-artifact@v4
        with:
          name: Ledgify-Windows-EXE
          path: ./release
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create v1.0.${{ github.run_number }} ./release/* --repo "${{ github.repository }}" --title "Ledgify v1.0.${{ github.run_number }}" --notes "Free offline accounting for Indian SME traders."
