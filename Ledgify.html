<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledgify — Apna Hisaab, Apni Marzi</title>
<style>
:root{
  --brand:#1A56DB;--brand-d:#1143A6;--brand-l:#EBF0FD;
  --acc:#E3A008;--acc-l:#FDF6B2;
  --ok:#0E9F6E;--ok-l:#DEF7EC;
  --bad:#E02424;--bad-l:#FDE8E8;
  --warn:#C27803;--warn-l:#FEF3C7;
  --bg:#F3F4F6;--surf:#fff;--bdr:#E5E7EB;
  --txt:#111827;--mut:#6B7280;--faint:#9CA3AF;
  --sw:224px;--th:56px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{display:flex;flex-direction:column;height:100vh;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font:inherit}

/* ── TOP BAR ── */
#top{height:var(--th);background:var(--brand);display:flex;align-items:center;gap:12px;padding:0 16px;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:0 1px 4px #0003}
#logo{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:18px;min-width:var(--sw);padding-right:8px}
#logo svg{flex-shrink:0}
#topbiz{color:#cbd5e1;font-size:12px;border-left:1px solid #3d6be0;padding-left:12px;line-height:1.3}
#topbiz b{display:block;color:#fff;font-size:13px}
#topsearch{flex:1;background:#2563EB;border:1px solid #3b82f6;border-radius:6px;padding:6px 12px;color:#fff;font:inherit;font-size:13px;outline:none;max-width:320px}
#topsearch::placeholder{color:#93c5fd}
.topbtn{background:none;border:none;color:#cbd5e1;padding:6px 10px;border-radius:6px;font-size:13px;display:flex;align-items:center;gap:4px}
.topbtn:hover{background:#2563EB;color:#fff}
#langpill{background:#1E40AF;color:#93c5fd;border:1px solid #3b82f6;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer}
#langpill:hover{background:#1D4ED8;color:#fff}

/* ── LAYOUT ── */
#wrap{display:flex;flex:1;margin-top:var(--th);overflow:hidden}

/* ── SIDEBAR ── */
#side{width:var(--sw);background:var(--surf);border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow-y:auto;position:fixed;top:var(--th);bottom:0;left:0;z-index:50}
.navsec{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:16px 14px 6px}
.navit{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:0;cursor:pointer;color:var(--mut);font-size:13px;position:relative;border:none;background:none;width:100%;text-align:left}
.navit:hover{background:var(--bg);color:var(--txt)}
.navit.on{background:var(--brand-l);color:var(--brand);font-weight:600}
.navit .ic{font-size:16px;width:20px;text-align:center}
.navit .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700}
.navit .ok-badge{margin-left:auto;background:var(--ok);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px}
#quickadd{margin:12px;border-radius:8px;background:var(--brand);color:#fff;border:none;padding:10px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;width:calc(100% - 24px)}
#quickadd:hover{background:var(--brand-d)}

/* ── MAIN ── */
#main{flex:1;margin-left:var(--sw);overflow-y:auto;min-height:0}
.page{padding:20px}
.phead{margin-bottom:20px}
.phead h2{font-size:20px;font-weight:700;color:var(--txt)}
.phead p{color:var(--mut);font-size:13px;margin-top:3px}

/* ── CARDS / GRID ── */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
.card{background:var(--surf);border-radius:10px;border:1px solid var(--bdr);padding:16px}
.kcard{border-radius:10px;padding:16px 20px;position:relative;overflow:hidden}
.kcard.blue{background:linear-gradient(135deg,#1A56DB,#2563EB);color:#fff}
.kcard.green{background:linear-gradient(135deg,#0E9F6E,#059669);color:#fff}
.kcard.amber{background:linear-gradient(135deg,#C27803,#D97706);color:#fff}
.kcard.red{background:linear-gradient(135deg,#E02424,#DC2626);color:#fff}
.kcard .kval{font-size:26px;font-weight:800;line-height:1;margin:6px 0}
.kcard .klbl{font-size:12px;opacity:.85;font-weight:500}
.kcard .ksub{font-size:11px;opacity:.75;margin-top:4px}
.kcard .kic{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:36px;opacity:.25}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font:inherit;font-size:13px;border:1px solid var(--bdr);background:var(--surf);color:var(--txt);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{background:var(--brand-d)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.red{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.lg{padding:10px 20px;font-size:15px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ── TABLE ── */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t th{background:var(--bg);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:8px 12px;text-align:left;border-bottom:1px solid var(--bdr);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid #F3F4F6;vertical-align:middle;font-size:13px}
table.t tr:last-child td{border-bottom:none}
table.t tr:hover td{background:#fafafa}
.r{text-align:right}
.mono{font-family:ui-monospace,monospace;font-size:12px}

/* ── CHIPS / BADGES ── */
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-l);color:#065F46}
.chip.bad{background:var(--bad-l);color:#9B1C1C}
.chip.warn{background:var(--warn-l);color:#78350F}
.chip.blue{background:var(--brand-l);color:var(--brand-d)}
.chip.grey{background:var(--bg);color:var(--mut)}
.chip.acc{background:var(--acc-l);color:#78350F}

/* ── FORM ELEMENTS ── */
.in{display:block;width:100%;padding:7px 10px;border:1px solid var(--bdr);border-radius:6px;font:inherit;font-size:13px;background:var(--surf);color:var(--txt);outline:none}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
.in.sm{padding:4px 8px;font-size:12px}
select.in{cursor:pointer}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}
.fgrp{margin-bottom:12px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ── MODALS ── */
#mover{display:none;position:fixed;inset:0;background:#0007;z-index:200;align-items:center;justify-content:center}
#mover.show{display:flex}
#mbox{background:var(--surf);border-radius:12px;width:min(560px,95vw);max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px #0003}
#mhead{padding:16px 20px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:15px}
#mbody{padding:20px;overflow-y:auto;flex:1}
#mfoot{padding:12px 20px;border-top:1px solid var(--bdr);display:flex;gap:8px;justify-content:flex-end}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

/* ── TABS ── */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--bdr);margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;border:none;background:none;font:inherit;font-size:13px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}

/* ── MISC ── */
.mt{margin-top:16px}
.mb{margin-bottom:12px}
.muted{color:var(--mut)}
.faint{color:var(--faint)}
.b{font-weight:600}
.small{font-size:12px}
.tip{background:var(--brand-l);border-left:3px solid var(--brand);padding:10px 14px;border-radius:0 6px 6px 0;font-size:13px;color:var(--brand-d);margin:12px 0}
.tip.warn{background:var(--warn-l);border-color:var(--warn);color:var(--warn)}
.tip.ok{background:var(--ok-l);border-color:var(--ok);color:#065F46}
.list-it{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #F9FAFB}
.list-it:last-child{border-bottom:none}
.inr::before{content:'₹'}
.sep{height:1px;background:var(--bdr);margin:16px 0}
.empty{text-align:center;padding:40px;color:var(--faint)}
.empty .eic{font-size:40px;margin-bottom:8px}
.prog{background:var(--bdr);border-radius:4px;height:6px;overflow:hidden}
.prog-bar{height:100%;border-radius:4px;background:var(--brand);transition:width .4s}

/* ── SALE/INVOICE ── */
#inv-items table td{padding:6px 8px}
#inv-items input{border:1px solid var(--bdr);border-radius:4px;padding:4px 6px;font:inherit;font-size:12px;width:100%}
.inv-total{background:var(--bg);border-radius:8px;padding:12px 16px;text-align:right}
.inv-total .bigamt{font-size:22px;font-weight:800;color:var(--brand)}

/* ── BANK ANALYZER ── */
.txn-row{display:grid;grid-template-columns:100px 1fr auto 90px 100px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #F3F4F6;font-size:13px}
.txn-row:hover{background:#fafafa}
.cat-pill{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.cat-sale{background:#DEF7EC;color:#065F46}
.cat-pur{background:#EBF0FD;color:#1A56DB}
.cat-exp{background:#FEF3C7;color:#78350F}
.cat-tax{background:#FDE8E8;color:#9B1C1C}
.cat-oth{background:#F3F4F6;color:#374151}
</style>
</head>

<script>
// ── ACTIONS ──
function wa(name,amt){toast(`📱 Opening WhatsApp for ${name} — ₹${inr(amt)}...`)}
function pickItem(idx,itemId){
  const it=ITEMS.find(x=>x.id===itemId);
  if(it){S.newInv.items[idx]={_id:it.id,name:it.name,qty:1,price:it.price,gst:it.gst};}
  render();
}

const ACT={
  go:d=>{S.page=d.id;render()},
  langToggle:()=>{S.lang=S.lang==='hi'?'en':'hi';applyLang();render()},
  saleTab:d=>{S.saleTab=d.k;render()},
  bankTab:d=>{S.bankTab=d.k;render()},
  gstTab:d=>{S.gstTab=d.k;render()},
  repTab:d=>{S.repTab=d.k;render()},
  quickSale:()=>{S.page='sale';S.saleTab='new';S.newInv={party:'',items:[{name:'',qty:1,price:0,gst:18}],notes:''};render()},
  saveInv:()=>{
    if(!S.newInv.items[0].price){toast('⚠️ Add at least one item with price');return;}
    const id='LG-00'+(INV.length+1);
    const sub=S.newInv.items.reduce((a,b)=>a+(b.qty*b.price),0);
    const tax=S.newInv.items.reduce((a,b)=>a+(b.qty*b.price*b.gst/100),0);
    INV.unshift({id,date:'2026-11-10',party:S.newInv.party||'p1',items:S.newInv.items.length,amt:sub,tax:Math.round(tax),total:Math.round(sub+tax),st:'unpaid',due:'2026-11-25'});
    S.saleTab='list';S.newInv={party:'',items:[{name:'',qty:1,price:0,gst:18}],notes:''};
    toast('✓ Invoice '+id+' saved! Print/WhatsApp options below.');render();
  },
  viewInv:d=>{
    const inv=INV.find(x=>x.id===d.id);if(!inv)return;
    modal(inv.id,`<div class="inv-total">
      <div><b>Party:</b> ${esc(pname(inv.party))}</div>
      <div><b>Date:</b> ${fds(inv.date)} &nbsp;·&nbsp; <b>Due:</b> ${fds(inv.due)}</div>
      <div class="sep"></div>
      <div>Taxable: ₹${inr(inv.amt)}</div><div>GST: ₹${inr(inv.tax)}</div>
      <div class="bigamt">Total: ₹${inr(inv.total)}</div>
      <div class="mt"><span class="chip ${inv.st==='paid'?'ok':inv.st==='partial'?'warn':'bad'}">${L[inv.st]||inv.st}</span></div>
    </div>`,[
      {t:'Mark Paid',cls:'ok',f:()=>{const i=INV.find(x=>x.id===d.id);if(i)i.st='paid';toast('✓ Marked paid');render()}},
      {t:'📱 WhatsApp',f:()=>wa(pname(inv.party),inv.total)},
      {t:'Close'}
    ]);
  },
  addParty:()=>modal('Add New Party',`<div class="fgrp"><label class="lbl">Party Name</label><input class="in" id="pn" placeholder="Sharma Electronics"></div>
    <div class="frow"><div class="fgrp"><label class="lbl">City</label><input class="in" id="pc" placeholder="Ahmedabad"></div>
    <div class="fgrp"><label class="lbl">Type</label><select class="in" id="pt"><option value="cust">Customer</option><option value="supp">Supplier</option><option value="both">Both</option></select></div></div>
    <div class="fgrp"><label class="lbl">GSTIN (optional)</label><input class="in" id="pg" placeholder="24XXXXX..."></div>`,[
    {t:'Cancel'},{t:'Save',cls:'pri',f:()=>{const n=$('#pn')?.value;if(!n){toast('Enter party name');return;}PARTIES.push({id:'p'+Date.now(),name:n,city:$('#pc')?.value||'',type:$('#pt')?.value||'cust',bal:0,due:null,overdue:false,gstin:$('#pg')?.value||''});toast('✓ Party added');render();}}
  ]),
  exportBank:()=>toast('✓ Exporting bank data as Tally XML + CA Package...'),
  exportTally:()=>toast('✓ Tally XML generated — open Tally and import via Gateway → Import Data'),
  exportCA:()=>{toast('✓ Preparing CA package (invoices + bank + GST)...');setTimeout(()=>toast('📱 Opening WhatsApp to send to '+BIZ.ca+'...'),1500)},
  gstPay:()=>toast('Opening GST portal for challan generation...'),
  fixTxn:()=>modal('Categorise Transaction',`<div class="fgrp"><label class="lbl">Category</label>
    <select class="in"><option>Customer Receipt (Sale)</option><option>Supplier Payment (Purchase)</option><option>Business Expense</option><option>Tax / GST</option><option>Bank Transfer</option><option>Other</option></select></div>
    <div class="fgrp"><label class="lbl">Party (optional)</label><select class="in"><option>-- None --</option>${PARTIES.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select></div>`,[
    {t:'Cancel'},{t:'Save',cls:'pri',f:()=>toast('✓ Transaction categorised')}
  ]),
  notif:()=>modal('Notifications 🔔',`<div>
    <div class="list-it"><span>⚠️</span><div><b>Overdue: Mobile Point</b><div class="small muted">₹2,15,000 — 15 days overdue · Send WhatsApp reminder</div></div></div>
    <div class="list-it"><span>📦</span><div><b>Low Stock: iPhone 15</b><div class="small muted">Only 3 units left · Min: 5</div></div></div>
    <div class="list-it"><span>🇮🇳</span><div><b>GSTR-1 Due: 11 Dec 2026</b><div class="small muted">38 invoices ready to file</div></div></div>
    <div class="list-it"><span>🤝</span><div><b>CA Reminder</b><div class="small muted">Send Nov data to CA Meera Iyer by 12 Nov</div></div></div>
  </div>`),
  help:()=>{S.page='help2';render()},
};

// ── RENDER ──
function render(){
  const fn=R[S.page]||R.home;
  $('#page').innerHTML=fn();
  // update sidebar active state
  $$('.navit').forEach(el=>{
    const id=el.dataset.id;
    el.classList.toggle('on',id===S.page);
  });
  // rebind events
  $$('[data-act]').forEach(el=>{
    el.onclick=e=>{
      e.stopPropagation();
      const act=el.dataset.act;
      if(ACT[act])ACT[act]({...el.dataset});
    };
  });
}

// ── INIT ──
document.addEventListener('DOMContentLoaded',()=>{
  applyLang();
  render();
  // close modal on backdrop click
  $('#mover').addEventListener('click',e=>{if(e.target===$('#mover'))closeMod()});
});
</script>
</body>
</html>
